<!--
======================================================================
SESSION 1: What Is a Website? (HTML Basics)
Bootcamp Curriculum: Daily Goals & Habits Tracker (Ages 13–16)
======================================================================

OBJECTIVES:
- Understand HTML as the "skeleton" of a webpage.
- Open and edit an HTML file.
- View it live in a web browser.

TOPICS:
- <!DOCTYPE html>, <html>, <head>, <body>, <title>, tags vs. elements.

FEATURES BUILT:
- A page with a title, a heading, and a short paragraph.

EVERYDAY ANALOGY:
- HTML is like the skeleton of a house:
  * <!DOCTYPE html> & <html> are the land and foundations.
  * <head> is the blueprint room with info about the house (like the deed title) that visitors don't walk through directly.
  * <body> is the visible rooms inside where people live.
  * <h1> is the main sign over the entrance.
  * <p> represents normal furniture and text inside the rooms.

WHAT THE CODE DOES:
- Every HTML file has the same skeleton. <!DOCTYPE html> tells the browser "this is a modern HTML5 page."
- <html> wraps everything.
- <head> holds information about the page that visitors don't see directly (e.g. tab title).
- <body> holds everything visitors actually see.
- <h1> is the main heading (biggest, one per page).
- <p> is a paragraph of normal text.
- Tags almost always come in pairs: an opening tag (<h1>) and a closing tag with a slash (</h1>).

EXERCISES:
- Change the heading text to your name's Goal Tracker.
- Add a second paragraph introducing yourself.
- Try adding an <h2> tag below the heading and see what happens in the browser.

EXPECTED OUTCOME:
- A working, personalized HTML page opened in a browser.
======================================================================
-->

<!DOCTYPE html>
<html>
<head>
    <title>Daily Goals Tracker</title>
</head>
<body>

    <!-- 
        This is our main heading. It tells visitors what this page is about.
        <h1> means "Heading, level 1" - the biggest, most important heading on the page.
    -->
    <h1>My Daily Goals Tracker</h1>

    <!-- 
        A paragraph tag holds normal text, just like a paragraph in a book.
    -->
    <p>This app will help me set goals and habits, and track my progress every day.</p>

</body>
</html>
